<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family:'Valentine';
            src: url('fonts/VALENTINES.otf') format('opertype'),
            url('fonts/VALENTINES.ttf') format('truetype'),
            url('fonts/VALENTINES.woff')
            format('woff');
            font-weight: normal;
            font-style: normal;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        h1{
            font-family:'Valentine', 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-size: 4em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Titulo</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Non porro dolorem, laborum ea dolorum sapiente, dolore laboriosam quis perspiciatis incidunt inventore nemo harum maxime tenetur modi tempora quasi. Tempora, id.]</p>
</body>
</html>
