<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /*configuração global das CSS*/
            height: 100%;
        }
        body{
            background-image:linear-gradient(to bottom , #FFA8BD 50%
            ,#330D16);
            /*pode ser mais de 2 cores; bottom : em baixo, top:no topo, to right: para direita, to left: para esquerda; 45deg.*/
            background-attachment: fixed;
            /*para a página ficar fixa e não rolando*/

            /* radial-gradient:circle: é degrade em um circulo*/
        }
    </style>
</head>
<body>
    <h1>Testando Gradiente</h1>
    
</body>
</html>
